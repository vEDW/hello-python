apiVersion: apps/v1  
kind: Deployment
metadata:
  name: frontend
  labels:
    app: hello-python
spec:
  replicas: 4
  selector:
    matchLabels:
      app: hello-python
  template:
    metadata:
      labels:
        app: hello-python
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - hello-python
              topologyKey: "kubernetes.io/hostname"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - hello-python
      containers:
      - name: frontend
        image: 'vedwcr.azurecr.io/hello-python:latest'
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: hello-python
        env:
          - name: MESSAGE
            value: "DC01"
          - name: MY_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
