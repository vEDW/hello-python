apiVersion: apps/v1  
kind: Deployment
metadata:
  name: frontend
  labels:
    app: hello-python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-python
  template:
    metadata:
      labels:
        app: hello-python
    spec:
      containers:
      - name: frontend
        image: 'registry.cloud-garage.net/vedw/hello-python:latest'
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: hello-python
        env:
          - name: MESSAGE
            value: "DC01"
          - name: MY_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
